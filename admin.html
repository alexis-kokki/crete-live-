<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crete Live — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f1e9;color:#101828}
    .wrap{max-width:900px;margin:auto;padding:18px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .brand{font-size:24px;font-weight:850}
    .sub{color:#667085;font-size:14px}
    .card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(16,24,40,.05)}
    .login{max-width:440px;margin:60px auto}
    input,textarea,select{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;background:#fff}
    textarea{min-height:90px;resize:vertical}
    label{display:block;font-size:13px;font-weight:800;color:#475467;margin-top:12px}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:#b45309;color:#fff}
    .full{width:100%;margin-top:14px}
    .approve{background:#157347;color:#fff}
    .reject,.danger{background:#b42318;color:#fff}
    .edit{background:#175cd3;color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;display:inline-block}
    .ghost{background:#eef2f6;color:#344054}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px;padding-bottom:2px}
    .tab{background:#eee8df;color:#344054;white-space:nowrap}
    .tab.active{background:#101828;color:white}
    .pill{display:inline-block;background:#fff3df;color:#9a4d00;border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px}
    .published-pill{background:#ecfdf3;color:#027a48}
    .poster{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin:10px 0}
    .poster-error{background:#fff4e5;color:#9a4d00;border-radius:10px;padding:11px;margin:10px 0;font-weight:700}
    #publishedList.layout-compact .poster{height:185px}
    #publishedList.layout-list .poster,#publishedList.layout-list .poster-error{display:none}
    .history-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .history-tools input{flex:1;min-width:210px;margin:0}
    .history-tools select{width:auto;min-width:165px;margin:0}
    .history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .preview-dialog{border:0;border-radius:18px;max-width:620px;width:calc(100% - 30px);max-height:85vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0004}
    .preview-dialog::backdrop{background:#10182899}
    .preview-dialog img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f2f4f7}
    .preview-dialog p{white-space:pre-wrap;line-height:1.5}
    .review-list{max-height:190px;overflow:auto;margin:8px 0 18px;padding-left:22px}
    .review-list li{padding:5px 0;overflow-wrap:anywhere}
    .review-reasons{font-size:13px;color:#b42318}
    .review-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
    .meta{display:grid;gap:6px;margin:12px 0;color:#475467}
    .title{font-size:22px;font-weight:850;margin:10px 0}
    .original{background:#f9fafb;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap;color:#344054}
    .hidden{display:none!important}
    .empty{text-align:center;color:#667085;padding:30px 16px}
    .error{color:#b42318;margin-top:12px}
    .ok{color:#157347;margin-top:12px;font-weight:700}
    .count{font-size:15px;color:#667085;margin-bottom:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-title{font-size:21px;font-weight:850;margin:0 0 6px}
    .hint{font-size:12px;color:#667085;margin-top:5px}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
    .toolbar input{margin-top:0}
    .pending-tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:12px}
    .pending-tools input,.pending-tools select{margin-top:0}
    .bulkbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#101828;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,24,40,.18)}
    .bulkbar .spacer{flex:1}
    .bulkbar label{display:flex;align-items:center;gap:8px;margin:0;color:#fff}
    .bulkbar input[type="checkbox"],.candidate-check{width:20px;height:20px;margin:0;accent-color:#b45309}
    .candidate-head{display:flex;align-items:flex-start;gap:12px}
    .candidate-head .title{flex:1;margin-top:0}
    .candidate-card.selected{outline:3px solid #f59e0b;background:#fffbeb}
    .warnings{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
    .warning-pill{background:#fef3f2;color:#b42318;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
    .bulk-status{font-size:13px;color:#d0d5dd}
    .secondary{background:#fff;color:#344054}
    .layout-switcher{display:flex;gap:6px;grid-column:1/-1;align-items:center}
    .layout-label{font-size:13px;font-weight:800;color:#475467;margin-right:4px}
    .layout-btn{background:#eee8df;color:#344054;padding:9px 12px;font-size:13px}
    .layout-btn.active{background:#101828;color:#fff}
    #candidates.layout-compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    #candidates.layout-compact .candidate-card{margin:0;padding:14px}
    #candidates.layout-compact .candidate-card img{height:190px!important;max-height:190px!important}
    #candidates.layout-compact .title{font-size:18px}
    #candidates.layout-compact .original{max-height:92px;overflow:auto;font-size:13px}
    #candidates.layout-compact .actions button,#candidates.layout-compact .actions .edit{padding:10px 12px;font-size:13px}
    #candidates.layout-list .candidate-card{padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(250px,1fr) auto;gap:14px;align-items:center}
    #candidates.layout-list .candidate-card>img,#candidates.layout-list .candidate-card>.pill,#candidates.layout-list .candidate-card>.warnings,#candidates.layout-list .candidate-card>.original,#candidates.layout-list .candidate-card>a,#candidates.layout-list .candidate-card>div[style]{display:none!important}
    #candidates.layout-list .candidate-head{align-items:center}
    #candidates.layout-list .title{font-size:16px;margin:0}
    #candidates.layout-list .meta{font-size:13px;margin:0}
    #candidates.layout-list .meta>div:nth-child(n+4){display:none}
    #candidates.layout-list .actions{margin:0;justify-content:flex-end}
    #candidates.layout-list .actions button,#candidates.layout-list .actions .edit{padding:9px 10px;font-size:12px}
    .published-layout-switcher{display:flex;gap:6px;align-items:center;margin:-2px 0 14px}
    .published-layout-btn{background:#eee8df;color:#344054;padding:9px 12px;font-size:13px}
    .published-layout-btn.active{background:#101828;color:#fff}
    #publishedList.layout-compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    #publishedList.layout-compact .card{margin:0;padding:14px}
    #publishedList.layout-compact .title{font-size:18px}
    #publishedList.layout-compact .actions button,#publishedList.layout-compact .actions .edit{padding:10px 12px;font-size:13px}
    #publishedList.layout-list .card{padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(250px,1fr) auto;gap:14px;align-items:center}
    #publishedList.layout-list .card>.pill{display:none}
    #publishedList.layout-list .title{font-size:16px;margin:0}
    #publishedList.layout-list .meta{font-size:13px;margin:0}
    #publishedList.layout-list .actions{margin:0;justify-content:flex-end}
    #publishedList.layout-list .actions button,#publishedList.layout-list .actions .edit{padding:9px 10px;font-size:12px}
    @media (max-width:900px){#candidates.layout-list .candidate-card,#publishedList.layout-list .card{grid-template-columns:1fr}.layout-label{display:none}}
    @media (max-width:760px){.pending-tools{grid-template-columns:1fr 1fr}.pending-tools input{grid-column:1/-1}}
    @media (max-width:520px){#candidates.layout-compact{grid-template-columns:1fr}.layout-switcher{overflow:auto}.layout-btn{white-space:nowrap}}
    a{color:#b45309}
    @media (max-width:620px){.grid2{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
<main class="wrap">
  <section id="loginView" class="login card">
    <div class="brand">Crete Live — Admin</div>
    <p class="sub">Σύνδεση διαχειριστή</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" class="primary full">Σύνδεση</button>
    <div id="loginMsg"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="top">
      <div>
        <div class="brand">Crete Live — Admin</div>
        <div class="sub">Κέντρο διαχείρισης</div>
      </div>
      <button id="logoutBtn" class="ghost">Έξοδος</button>
    </div>

    <div class="tabs">
      <button id="tabPending" class="tab active">Προς έλεγχο</button>
      <button id="tabPublished" class="tab">Δημοσιευμένες</button>
      <button id="tabHistory" class="tab">Ιστορικό</button>
      <button id="tabNew" class="tab">+ Νέα εκδήλωση</button>
    </div>

    <section id="pendingView">
      <div class="pending-tools">
        <input id="pendingSearch" placeholder="Αναζήτηση τίτλου, χώρου ή καλλιτέχνη">
        <select id="pendingRegion">
          <option value="">Όλοι οι νομοί</option>
          <option>Ηράκλειο</option><option>Χανιά</option><option>Ρέθυμνο</option><option>Λασίθι</option>
        </select>
        <select id="pendingQuality">
          <option value="">Όλες οι εγγραφές</option>
          <option value="complete">Πλήρεις</option>
          <option value="missing">Με ελλείψεις</option>
        </select>
        <button id="refreshPending" class="ghost">Ανανέωση</button>
        <div class="layout-switcher" aria-label="Διάταξη προβολής">
          <span class="layout-label">Διάταξη:</span>
          <button class="layout-btn" data-layout="large" type="button">▣ Μεγάλες</button>
          <button class="layout-btn" data-layout="compact" type="button">▦ Μικρές</button>
          <button class="layout-btn" data-layout="list" type="button">☷ Λίστα</button>
        </div>
      </div>
      <div id="bulkbar" class="bulkbar hidden">
        <label><input id="selectAllCandidates" type="checkbox"> Επιλογή όλων</label>
        <strong id="selectedCount">0 επιλεγμένες</strong>
        <span class="spacer"></span>
        <button id="bulkApprove" class="approve">Έγκριση επιλεγμένων</button>
        <button id="bulkReject" class="reject">Απόρριψη επιλεγμένων</button>
        <span id="bulkStatus" class="bulk-status"></span>
      </div>
      <div id="count" class="count"></div>
      <div id="candidates"></div>
    </section>

    <section id="publishedView" class="hidden">
      <div class="toolbar">
        <input id="publishedSearch" placeholder="Αναζήτηση τίτλου, πόλης ή χώρου">
        <button id="refreshPublished" class="ghost">Ανανέωση</button>
      </div>
      <div class="published-layout-switcher" aria-label="Διάταξη δημοσιευμένων">
        <span class="layout-label">Διάταξη:</span>
        <button class="published-layout-btn" data-layout="large" type="button">▣ Μεγάλες</button>
        <button class="published-layout-btn" data-layout="compact" type="button">▦ Μικρές</button>
        <button class="published-layout-btn" data-layout="list" type="button">☷ Λίστα</button>
      </div>
      <div id="publishedCount" class="count"></div>
      <div id="publishedList"></div>
    </section>

    <section id="historyView" class="hidden">
      <div class="history-tools">
        <input id="historySearch" placeholder="Αναζήτηση στο ιστορικό">
        <select id="historyStatus"><option value="">Όλες οι αποφάσεις</option><option value="approved">Εγκεκριμένες</option><option value="rejected">Απορριφθείσες</option></select>
        <button id="refreshHistory" class="ghost">Ανανέωση</button>
      </div>
      <div id="historyCount" class="count"></div>
      <div id="historyList"></div>
    </section>

    <section id="newView" class="hidden">
      <div class="card">
        <div class="form-title">Νέα εκδήλωση</div>
        <div class="sub">Χειροκίνητη καταχώρηση και άμεση δημοσίευση.</div>

        <label>Τίτλος *</label><input id="fTitle">
        <div class="grid2">
          <div><label>Ημερομηνία *</label><input id="fDate" type="date"></div>
          <div><label>Ώρα έναρξης *</label><input id="fTime" type="time"></div>
        </div>
        <label>Χώρος / μαγαζί *</label><input id="fVenue">
        <div class="grid2">
          <div><label>Πόλη *</label><input id="fCity"></div>
          <div>
            <label>Νομός / περιοχή *</label>
            <select id="fRegion">
              <option value="">Επιλογή</option>
              <option>Ηράκλειο</option><option>Χανιά</option><option>Ρέθυμνο</option><option>Λασίθι</option>
            </select>
          </div>
        </div>
        <label>Διεύθυνση</label><input id="fAddress">
        <label>Καλλιτέχνες</label><input id="fArtists">
        <label>Είδη μουσικής</label><input id="fGenres">
        <div class="grid2">
          <div><label>Τιμή / είσοδος</label><input id="fPrice"></div>
          <div><label>Τηλέφωνο</label><input id="fPhone"></div>
        </div>
        <label>Poster / εικόνα URL</label><input id="fPoster">
        <label>Περιγραφή</label><textarea id="fDescription"></textarea>
        <button id="publishManualBtn" class="approve full">Δημοσίευση εκδήλωσης</button>
        <div id="manualMsg"></div>
      </div>
    </section>
  </section>
  <dialog id="candidatePreview" class="preview-dialog" aria-label="Προεπισκόπηση εκδήλωσης">
    <button id="closePreview" class="ghost" type="button" style="float:right">Κλείσιμο</button>
    <div id="previewContent"></div>
  </dialog>
  <dialog id="bulkReview" class="preview-dialog" aria-labelledby="bulkReviewTitle">
    <h2 id="bulkReviewTitle">Έλεγχος μαζικής δημοσίευσης</h2>
    <div id="bulkReviewContent"></div>
    <div class="review-actions">
      <button id="cancelBulkReview" class="ghost" type="button">Ακύρωση</button>
      <button id="confirmBulkReview" class="approve" type="button">Δημοσίευση</button>
    </div>
  </dialog>
</main>

<script>
const db = window.supabase.createClient("https://skstztwseipuqpqtlzfa.supabase.co", "sb_publishable_lnNg0aoYe4zsBKkV9XactA_IzcWBdiJ");
const $ = id => document.getElementById(id);
const selectedCandidates = new Set();
let bulkBusy = false;
let candidateLayout = localStorage.getItem("creteLiveAdminLayout") || "compact";
let publishedLayout = localStorage.getItem("creteLivePublishedLayout") || "compact";

function setCandidateLayout(layout){
  if(!["large","compact","list"].includes(layout))layout="compact";
  candidateLayout=layout;
  localStorage.setItem("creteLiveAdminLayout",layout);
  const container=$("candidates");
  if(container)container.className=layout==="large"?"":"layout-"+layout;
  document.querySelectorAll(".layout-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.layout===layout));
}
function setPublishedLayout(layout){
  if(!["large","compact","list"].includes(layout))layout="compact";
  publishedLayout=layout;
  localStorage.setItem("creteLivePublishedLayout",layout);
  const container=$("publishedList");
  if(container)container.className=layout==="large"?"":"layout-"+layout;
  document.querySelectorAll(".published-layout-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.layout===layout));
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function slugify(text){
  const greek={'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o'};
  return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .split("").map(ch=>greek[ch]||ch).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,55)||"item";
}
function uniqueSlug(text){ return slugify(text)+"-"+Date.now().toString(36); }
function formatDate(v){ return v ? new Date(v+"T12:00:00").toLocaleDateString("el-GR",{day:"numeric",month:"long",year:"numeric"}) : "Χωρίς ημερομηνία"; }
function formatTime(v){ return v ? String(v).slice(0,5) : "Χωρίς ώρα"; }
function splitCSV(v){ return String(v||"").split(",").map(x=>x.trim()).filter(Boolean); }

async function showCorrectView(){
  const {data:{session}} = await db.auth.getSession();
  $("loginView").classList.toggle("hidden", !!session);
  $("adminView").classList.toggle("hidden", !session);
  if(session) await loadCandidates();
}
$("loginBtn").onclick = async()=>{
  $("loginMsg").textContent="Σύνδεση...";
  const {error} = await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){$("loginMsg").textContent="Αποτυχία σύνδεσης: "+error.message;$("loginMsg").className="error";return;}
  $("loginMsg").textContent=""; await showCorrectView();
};
$("logoutBtn").onclick = async()=>{await db.auth.signOut();await showCorrectView();};

function setTab(which){
  for(const name of ["pending","published","history","new"]){
    $(name+"View").classList.toggle("hidden",name!==which);
    $("tab"+name[0].toUpperCase()+name.slice(1)).classList.toggle("active",name===which);
  }
  if(which==="pending") loadCandidates();
  if(which==="published") loadPublished();
  if(which==="history") loadHistory();
}
$("tabPending").onclick=()=>setTab("pending");
$("tabPublished").onclick=()=>setTab("published");
$("tabHistory").onclick=()=>setTab("history");
$("tabNew").onclick=()=>setTab("new");

async function getOrCreate(table,name){
  const clean=String(name||"").trim(); if(!clean)return null;
  const {data:existing,error:findError}=await db.from(table).select("id").ilike("name",clean).limit(1);
  if(findError)throw findError;
  if(existing?.length)return existing[0].id;
  const {data:created,error:createError}=await db.from(table).insert({name:clean,slug:uniqueSlug(clean)}).select("id").single();
  if(createError)throw createError; return created.id;
}
async function getOrCreateVenue(name,city,region,address,phone){
  const clean=String(name||"").trim(); if(!clean)return null;
  const {data:existing,error:findError}=await db.from("venues").select("id").ilike("name",clean).limit(1);
  if(findError)throw findError;
  if(existing?.length)return existing[0].id;
  const {data:created,error:createError}=await db.from("venues").insert({
    name:clean,slug:uniqueSlug(clean),city:city||null,region:region||null,address:address||null,phone:phone||null
  }).select("id").single();
  if(createError)throw createError; return created.id;
}

const failedImageUrls = new Set();
function localToday(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function markCandidateImageError(id){
  const c=(window.currentCandidates||[]).find(item=>item.id===id);
  if(!c)return;
  failedImageUrls.add(c.image_url);
  const card=document.querySelector('[data-candidate-id="'+id+'"]');
  const img=card?.querySelector(".candidate-poster");
  if(img)img.hidden=true;
  if(card&&!card.querySelector(".poster-error")){
    const box=document.createElement("div");
    box.className="poster-error";
    box.textContent="Η αφίσα δεν φορτώνει. Έλεγξε ή άλλαξε το URL πριν από τη δημοσίευση.";
    img?.after(box);
  }
}
function checkImage(url){
  if(!url)return Promise.resolve(false);
  return new Promise(resolve=>{
    const img=new Image();
    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;clearTimeout(timer);resolve(ok)};
    const timer=setTimeout(()=>finish(false),8000);
    img.onload=()=>finish(img.naturalWidth>0);
    img.onerror=()=>finish(false);
    img.src=url;
  });
}
function candidateWarnings(c){
  const missing=[];
  if(!c.extracted_title)missing.push("τίτλος");
  if(!c.extracted_date)missing.push("ημερομηνία");
  if(!c.extracted_time)missing.push("ώρα");
  if(!c.extracted_venue)missing.push("χώρος");
  if(!c.extracted_region)missing.push("νομός");
  if(!c.image_url)missing.push("αφίσα");
  else if(!/^https?:\/\//i.test(c.image_url)||failedImageUrls.has(c.image_url))missing.push("αφίσα που δεν φορτώνει");
  if(c.extracted_date&&c.extracted_date<localToday())missing.push("ημερομηνία στο παρελθόν");
  return missing;
}
function filteredCandidates(){
  const q=$("pendingSearch").value.trim().toLowerCase();
  const region=$("pendingRegion").value;
  const quality=$("pendingQuality").value;
  return (window.currentCandidates||[]).filter(c=>{
    const hay=[c.extracted_title,c.extracted_venue,c.extracted_city,c.extracted_region,...(c.extracted_artists||[])].join(" ").toLowerCase();
    const missing=candidateWarnings(c).length>0;
    return (!q||hay.includes(q))&&(!region||c.extracted_region===region)&&(!quality||(quality==="missing"?missing:!missing));
  });
}
function updateBulkBar(){
  const visible=filteredCandidates();
  $("bulkbar").classList.toggle("hidden",!(window.currentCandidates||[]).length);
  $("selectedCount").textContent=`${selectedCandidates.size} επιλεγμένες`;
  $("selectAllCandidates").checked=visible.length>0&&visible.every(c=>selectedCandidates.has(c.id));
  $("selectAllCandidates").indeterminate=visible.some(c=>selectedCandidates.has(c.id))&&!$("selectAllCandidates").checked;
  $("bulkApprove").disabled=bulkBusy||!selectedCandidates.size;
  $("bulkReject").disabled=bulkBusy||!selectedCandidates.size;
}
function toggleCandidate(id,checked){
  checked?selectedCandidates.add(id):selectedCandidates.delete(id);
  document.querySelector(`[data-candidate-id="${id}"]`)?.classList.toggle("selected",checked);
  updateBulkBar();
}
function renderCandidates(){
  setCandidateLayout(candidateLayout);
  const data=filteredCandidates();
  $("count").textContent=`${data.length} από ${(window.currentCandidates||[]).length} εκδηλώσεις προς έλεγχο`;
  if(!data.length){
    $("candidates").innerHTML='<div class="card empty">Δεν βρέθηκαν εκδηλώσεις με αυτά τα φίλτρα.</div>';
    updateBulkBar(); return;
  }
  $("candidates").innerHTML=data.map(c=>{
    const warnings=candidateWarnings(c);
    return `
    <article class="card candidate-card ${selectedCandidates.has(c.id)?"selected":""}" data-candidate-id="${c.id}">
      <div class="candidate-head">
        <input class="candidate-check" type="checkbox" aria-label="Επιλογή εκδήλωσης" ${selectedCandidates.has(c.id)?"checked":""}
          onchange="toggleCandidate('${c.id}',this.checked)">
        <div class="title">${esc(c.extracted_title||"Χωρίς τίτλο")}</div>
      </div>
      ${c.image_url?`<img class="candidate-poster" src="${esc(c.image_url)}" alt="${esc(c.extracted_title||"Αφίσα εκδήλωσης")}" style="width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:14px" loading="lazy" onerror="markCandidateImageError('${c.id}')">`:'<div class="poster-error">Δεν έχει καταχωριστεί αφίσα.</div>'}
      <span class="pill">${esc(c.detection_type||"candidate")}</span>
      ${warnings.length?`<div class="warnings">${warnings.map(x=>`<span class="warning-pill">Λείπει: ${esc(x)}</span>`).join("")}</div>`:""}
      <div class="meta">
        <div><strong>Ημερομηνία:</strong> ${esc(formatDate(c.extracted_date))} · ${esc(formatTime(c.extracted_time))}</div>
        <div><strong>Χώρος:</strong> ${esc(c.extracted_venue||"—")}</div>
        <div><strong>Περιοχή:</strong> ${esc(c.extracted_city||c.extracted_region||"—")}</div>
        ${c.extracted_artists?.length?`<div><strong>Καλλιτέχνες:</strong> ${esc(c.extracted_artists.join(", "))}</div>`:""}
        ${c.extracted_price?`<div><strong>Τιμή:</strong> ${esc(c.extracted_price)}</div>`:""}
        ${c.confidence_score!=null?`<div><strong>Confidence:</strong> ${esc(c.confidence_score)}%</div>`:""}
      </div>
      ${c.original_text?`<div class="original"><strong>Περιγραφή πηγής:</strong><br>${esc(c.original_text)}</div>`:""}
      ${c.source_url?`<div style="margin-top:12px"><a href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer">Άνοιγμα αρχικής πηγής ↗</a></div>`:""}
      <div class="actions">
        <button class="ghost" type="button" onclick="previewCandidate('${c.id}')">Προεπισκόπηση</button>
        <a class="edit" href="admin-candidate-edit.html?id=${encodeURIComponent(c.id)}">Επεξεργασία</a>
        <button class="approve" onclick="approveCandidate('${c.id}')">Έγκριση & Δημοσίευση</button>
        <button class="reject" onclick="rejectCandidate('${c.id}')">Απόρριψη</button>
      </div>
    </article>`;
  }).join("");
  updateBulkBar();
}
async function loadCandidates(){
  $("candidates").innerHTML='<div class="empty">Φόρτωση...</div>';
  const {data,error}=await db.from("ingestion_candidates").select("*").eq("review_status","pending").order("created_at",{ascending:false});
  if(error){$("candidates").innerHTML='<div class="card error">'+esc(error.message)+'</div>';return;}
  window.currentCandidates=data||[];
  selectedCandidates.clear();
  renderCandidates();
}
async function publishCandidate(c){
  const venue_id=c.extracted_venue?await getOrCreateVenue(c.extracted_venue,c.extracted_city,c.extracted_region,"",c.extracted_phone||""):null;
  const {data:event,error}=await db.from("events").insert({
    title:c.extracted_title||"Live εκδήλωση",slug:uniqueSlug(c.extracted_title||"live"),description:c.original_text||null,
    event_date:c.extracted_date,start_time:c.extracted_time,venue_id,region:c.extracted_region||null,city:c.extracted_city||null,
    price_text:c.extracted_price||null,phone:c.extracted_phone||null,poster_url:c.image_url||null,status:"published",
    created_via:"manual",confidence_score:c.confidence_score??null,last_verified_at:new Date().toISOString()
  }).select("id").single();
  if(error)throw error;
  for(const name of(c.extracted_artists||[])){const artist_id=await getOrCreate("artists",name);const r=await db.from("event_artists").insert({event_id:event.id,artist_id});if(r.error)throw r.error;}
  for(const name of(c.extracted_genres||[])){const genre_id=await getOrCreate("genres",name);const r=await db.from("event_genres").insert({event_id:event.id,genre_id});if(r.error)throw r.error;}
  const r=await db.from("ingestion_candidates").update({
    review_status:"approved",reviewed_at:new Date().toISOString(),created_event_id:event.id,possible_duplicate_event_id:event.id
  }).eq("id",c.id);
  if(r.error)throw r.error;
}
function previewCandidate(id){
  const c=(window.currentCandidates||[]).find(item=>item.id===id);
  if(!c)return;
  $("previewContent").innerHTML=`
    <span class="pill">Προεπισκόπηση πριν από τη δημοσίευση</span>
    ${c.image_url?`<img src="${esc(c.image_url)}" alt="${esc(c.extracted_title||"Αφίσα")}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="poster-error" hidden>Η αφίσα δεν φορτώνει.</div>`:'<div class="poster-error">Δεν έχει καταχωριστεί αφίσα.</div>'}
    <h2>${esc(c.extracted_title||"Χωρίς τίτλο")}</h2>
    <div class="meta">
      <div><strong>Ημερομηνία:</strong> ${esc(formatDate(c.extracted_date))} · ${esc(formatTime(c.extracted_time))}</div>
      <div><strong>Χώρος:</strong> ${esc(c.extracted_venue||"—")}</div>
      <div><strong>Περιοχή:</strong> ${esc(c.extracted_city||c.extracted_region||"—")}</div>
      <div><strong>Καλλιτέχνες:</strong> ${esc((c.extracted_artists||[]).join(", ")||"—")}</div>
      <div><strong>Είσοδος:</strong> ${esc(c.extracted_price||"Δεν αναφέρεται")}</div>
    </div>
    <p>${esc(c.original_text||"Δεν υπάρχει περιγραφή.")}</p>`;
  $("candidatePreview").showModal();
}
$("closePreview").onclick=()=>$("candidatePreview").close();
$("candidatePreview").onclick=e=>{if(e.target===$("candidatePreview"))$("candidatePreview").close();};
async function approvalIssues(c){
  const problems=candidateWarnings(c);
  if(c.image_url&&/^https?:\/\//i.test(c.image_url)){
    if(!await checkImage(c.image_url)){
      failedImageUrls.add(c.image_url);
      if(!problems.includes("αφίσα που δεν φορτώνει"))problems.push("αφίσα που δεν φορτώνει");
      markCandidateImageError(c.id);
    }
  }
  if(!c.extracted_title||!c.extracted_date)return problems;
  const {data,error}=await db.from("events").select("id")
    .eq("status","published").eq("event_date",c.extracted_date)
    .eq("title",c.extracted_title).limit(1);
  if(error)throw error;
  if(data?.length)problems.push("πιθανό διπλότυπο δημοσιευμένης εκδήλωσης");
  return problems;
}
async function approveCandidate(id){
  const c=(window.currentCandidates||[]).find(x=>x.id===id);if(!c)return;
  try{
    const issues=await approvalIssues(c);
    const required=["τίτλος","ημερομηνία","ώρα","χώρος","νομός","αφίσα","αφίσα που δεν φορτώνει","ημερομηνία στο παρελθόν","πιθανό διπλότυπο δημοσιευμένης εκδήλωσης"];
    if(issues.some(x=>required.includes(x))){
      alert("Διόρθωσε πρώτα τα υποχρεωτικά στοιχεία: "+issues.join(", "));return;
    }
    const warning=issues.length?"\n\nΈλεγχος: "+issues.join(", "):"";
    if(!confirm("Να εγκριθεί και να δημοσιευτεί;"+warning))return;
    await publishCandidate(c);alert("Η εκδήλωση εγκρίθηκε και δημοσιεύτηκε!");await loadCandidates();
  }catch(err){alert("Σφάλμα: "+(err.message||err));}
}
async function rejectCandidate(id){
  if(!confirm("Να απορριφθεί αυτή η εκδήλωση;"))return;
  const {error}=await db.from("ingestion_candidates").update({review_status:"rejected",reviewed_at:new Date().toISOString()}).eq("id",id);
  if(error)return alert("Σφάλμα: "+error.message);
  await loadCandidates();
}
function reviewBulkPublication(ready,skipped,failed){
  const list=(items,withReasons)=>items.length
    ?'<ol class="review-list">'+items.map(item=>'<li>'+esc(item.title||"Χωρίς τίτλο")+
      (item.extracted_date?' · '+esc(formatDate(item.extracted_date)):'')+
      (withReasons?'<div class="review-reasons">'+esc((item.issues||[item.error]).join(", "))+'</div>':'')+'</li>').join("")+'</ol>'
    :'<p class="sub">Καμία</p>';
  $("bulkReviewContent").innerHTML=
    '<p>Θα δημοσιευτούν '+ready.length+' · Θα παραλειφθούν '+skipped.length+' · Σφάλματα ελέγχου '+failed.length+'</p>'+
    '<h3>Προς δημοσίευση</h3>'+list(ready,false)+
    '<h3>Παραλείπονται</h3>'+list(skipped,true)+
    (failed.length?'<h3>Σφάλματα ελέγχου</h3>'+list(failed,true):'');
  $("confirmBulkReview").disabled=!ready.length;
  $("confirmBulkReview").textContent="Δημοσίευση "+ready.length+" εκδηλώσεων";
  const dialog=$("bulkReview");
  return new Promise(resolve=>{
    let done=false;
    const finish=answer=>{if(done)return;done=true;dialog.close();resolve(answer)};
    $("confirmBulkReview").onclick=()=>finish(true);
    $("cancelBulkReview").onclick=()=>finish(false);
    dialog.oncancel=e=>{e.preventDefault();finish(false)};
    dialog.showModal();
  });
}
async function bulkApproveCandidates(){
  const items=(window.currentCandidates||[]).filter(c=>selectedCandidates.has(c.id));
  if(!items.length||bulkBusy)return;
  bulkBusy=true;updateBulkBar();
  const ready=[],skipped=[],failed=[],seen=new Set();
  try{
    for(const c of items){
      $("bulkStatus").textContent="Έλεγχος "+(ready.length+skipped.length+failed.length+1)+"/"+items.length+"...";
      try{
        const issues=await approvalIssues(c);
        const key=String(c.extracted_date||"")+"|"+String(c.extracted_title||"").trim().toLocaleLowerCase("el");
        if(!issues.length&&seen.has(key))issues.push("διπλότυπο μέσα στην επιλογή");
        if(issues.length)skipped.push({title:c.extracted_title,extracted_date:c.extracted_date,issues});
        else{ready.push(c);seen.add(key)}
      }catch(err){failed.push({title:c.extracted_title,extracted_date:c.extracted_date,error:err.message||String(err)});}
    }
    $("bulkStatus").textContent="";
    if(!await reviewBulkPublication(ready,skipped,failed))return;
    let success=0;
    for(const c of ready){
      $("bulkStatus").textContent="Δημοσίευση "+(success+1)+"/"+ready.length+"...";
      try{
        const issues=await approvalIssues(c);
        if(issues.length){skipped.push({title:c.extracted_title,issues});continue}
        await publishCandidate(c);success++;
      }catch(err){failed.push({title:c.extracted_title,error:err.message||String(err)});}
    }
    alert("Δημοσιεύτηκαν "+success+". Παραλείφθηκαν "+skipped.length+". Απέτυχαν "+failed.length+
      (failed.length?"\n"+failed.map(x=>(x.title||"Χωρίς τίτλο")+": "+x.error).join("\n"):""));
    await loadCandidates();
  }finally{
    bulkBusy=false;updateBulkBar();$("bulkStatus").textContent="";
  }
}
async function bulkRejectCandidates(){
  const ids=[...selectedCandidates];
  if(!ids.length||!confirm(`Να απορριφθούν ${ids.length} εκδηλώσεις;`))return;
  bulkBusy=true;updateBulkBar();
  const {error}=await db.from("ingestion_candidates").update({review_status:"rejected",reviewed_at:new Date().toISOString()}).in("id",ids);
  bulkBusy=false;
  if(error){updateBulkBar();return alert("Σφάλμα: "+error.message);}
  await loadCandidates();
}
$("pendingSearch").oninput=renderCandidates;
$("pendingRegion").onchange=renderCandidates;
$("pendingQuality").onchange=renderCandidates;
$("refreshPending").onclick=loadCandidates;
$("selectAllCandidates").onchange=()=>{
  for(const c of filteredCandidates())$("selectAllCandidates").checked?selectedCandidates.add(c.id):selectedCandidates.delete(c.id);
  renderCandidates();
};
$("bulkApprove").onclick=bulkApproveCandidates;
$("bulkReject").onclick=bulkRejectCandidates;
document.querySelectorAll(".layout-btn").forEach(btn=>btn.onclick=()=>setCandidateLayout(btn.dataset.layout));
setCandidateLayout(candidateLayout);

async function loadHistory(){
  $("historyList").innerHTML='<div class="empty">Φόρτωση...</div>';
  const {data,error}=await db.from("ingestion_candidates")
    .select("id,source_url,extracted_title,extracted_date,extracted_venue,review_status,reviewed_at,created_event_id")
    .in("review_status",["approved","rejected"])
    .order("reviewed_at",{ascending:false}).limit(500);
  if(error){$("historyList").innerHTML='<div class="card error">'+esc(error.message)+'</div>';return;}

}
function renderHistory(){
  const q=$("historySearch").value.trim().toLowerCase(),status=$("historyStatus").value;
  const rows=(window.reviewHistory||[]).filter(c=>(!status||c.review_status===status)&&
    (!q||[c.extracted_title,c.extracted_venue].join(" ").toLowerCase().includes(q)));
  $("historyCount").textContent=rows.length+" αποφάσεις (έως 500 πρόσφατες)";
  $("historyList").innerHTML=rows.length?rows.map(c=>`
    <article class="card history-row">
      <div>
        <span class="pill ${c.review_status==="approved"?"published-pill":""}">${c.review_status==="approved"?"Εγκρίθηκε":"Απορρίφθηκε"}</span>
        <div class="title">${esc(c.extracted_title||"Χωρίς τίτλο")}</div>
        <div class="sub">${esc(formatDate(c.extracted_date))} · ${esc(c.extracted_venue||"—")} · Απόφαση: ${esc(c.reviewed_at?new Date(c.reviewed_at).toLocaleString("el-GR"):"Χωρίς ημερομηνία")}</div>
      </div>
      <div class="actions">
        ${c.source_url?`<a href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer">Πηγή ↗</a>`:""}
        ${c.created_event_id?`<a class="edit" href="admin-edit.html?id=${encodeURIComponent(c.created_event_id)}">Εκδήλωση</a>`:""}
      </div>
    </article>`).join(""):'<div class="card empty">Δεν βρέθηκαν αποφάσεις.</div>';
}
$("historySearch").oninput=renderHistory;
$("historyStatus").onchange=renderHistory;
$("refreshHistory").onclick=loadHistory;

async function loadPublished(){
  $("publishedList").innerHTML='<div class="empty">Φόρτωση...</div>';
  const {data,error}=await db.from("events").select(`
    *,
    venue:venues(id,name,city,region,address,phone),
    event_artists(artist:artists(id,name)),
    event_genres(genre:genres(id,name))
  `).eq("status","published").order("event_date",{ascending:true}).order("start_time",{ascending:true});
  if(error){$("publishedList").innerHTML='<div class="card error">'+esc(error.message)+'</div>';return;}
  window.publishedEvents=data||[]; renderPublished();
}

  setPublishedLayout(publishedLayout);
  const q=$("publishedSearch").value.trim().toLowerCase();
  const data=(window.publishedEvents||[]).filter(e=>[e.title,e.city,e.region,e.venue?.name].join(" ").toLowerCase().includes(q));

      <div class="title">${esc(e.title)}</div>
      <div class="meta">
        <div><strong>Ημερομηνία:</strong> ${esc(formatDate(e.event_date))} · ${esc(formatTime(e.start_time))}</div>
        <div><strong>Χώρος:</strong> ${esc(e.venue?.name||"—")}</div>
        <div><strong>Περιοχή:</strong> ${esc(e.city||e.region||"—")}</div>
      </div>
      <div class="actions">
        <a class="edit" href="admin-edit.html?id=${encodeURIComponent(e.id)}">Επεξεργασία</a>

$("publishedSearch").oninput=renderPublished;
$("refreshPublished").onclick=loadPublished;
document.querySelectorAll(".published-layout-btn").forEach(btn=>btn.onclick=()=>setPublishedLayout(btn.dataset.layout));
setPublishedLayout(publishedLayout);

async function deleteEvent(id){
  const e=(window.publishedEvents||[]).find(x=>x.id===id);
  if(!confirm(`Να διαγραφεί οριστικά η εκδήλωση "${e?.title||""}";`))return;
  try{
    let r=await db.from("event_artists").delete().eq("event_id",id); if(r.error)throw r.error;
    r=await db.from("event_genres").delete().eq("event_id",id); if(r.error)throw r.error;
    await db.from("ingestion_candidates").update({possible_duplicate_event_id:null}).eq("possible_duplicate_event_id",id);
    r=await db.from("events").delete().eq("id",id); if(r.error)throw r.error;
    alert("Η εκδήλωση διαγράφηκε."); await loadPublished();
  }catch(err){alert("Δεν διαγράφηκε: "+(err.message||err));}
}

  const msg=$("manualMsg");msg.textContent="";

    const venue_id=await getOrCreateVenue(venueName,city,region,address,phone);

    for(const name of artists){const artist_id=await getOrCreate("artists",name);const r=await db.from("event_artists").insert({event_id:event.id,artist_id});if(r.error)throw r.error;}
