<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crete Live — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f1e9;color:#101828}
    .wrap{max-width:900px;margin:auto;padding:18px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .brand{font-size:24px;font-weight:850}
    .sub{color:#667085;font-size:14px}
    .card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(16,24,40,.05)}
    .login{max-width:440px;margin:60px auto}
    input,textarea,select{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;background:#fff}
    textarea{min-height:90px;resize:vertical}
    label{display:block;font-size:13px;font-weight:800;color:#475467;margin-top:12px}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:#b45309;color:#fff}
    .full{width:100%;margin-top:14px}
    .approve{background:#157347;color:#fff}
    .reject,.danger{background:#b42318;color:#fff}
    .edit{background:#175cd3;color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;display:inline-block}
    .ghost{background:#eef2f6;color:#344054}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px;padding-bottom:2px}
    .tab{background:#eee8df;color:#344054;white-space:nowrap}
    .tab.active{background:#101828;color:white}
    .pill{display:inline-block;background:#fff3df;color:#9a4d00;border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px}
    .published-pill{background:#ecfdf3;color:#027a48}
    .meta{display:grid;gap:6px;margin:12px 0;color:#475467}
    .title{font-size:22px;font-weight:850;margin:10px 0}
    .original{background:#f9fafb;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap;color:#344054}
    .hidden{display:none!important}
    .empty{text-align:center;color:#667085;padding:30px 16px}
    .error{color:#b42318;margin-top:12px}
    .ok{color:#157347;margin-top:12px;font-weight:700}
    .count{font-size:15px;color:#667085;margin-bottom:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-title{font-size:21px;font-weight:850;margin:0 0 6px}
    .hint{font-size:12px;color:#667085;margin-top:5px}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
    .toolbar input{margin-top:0}
    a{color:#b45309}
    @media (max-width:620px){.grid2{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
<main class="wrap">
  <section id="loginView" class="login card">
    <div class="brand">Crete Live — Admin</div>
    <p class="sub">Σύνδεση διαχειριστή</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" class="primary full">Σύνδεση</button>
    <div id="loginMsg"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="top">
      <div>
        <div class="brand">Crete Live — Admin</div>
        <div class="sub">Κέντρο διαχείρισης</div>
      </div>
      <button id="logoutBtn" class="ghost">Έξοδος</button>
    </div>

    <div class="tabs">
      <button id="tabPending" class="tab active">Προς έλεγχο</button>
      <button id="tabPublished" class="tab">Δημοσιευμένες</button>
      <button id="tabNew" class="tab">+ Νέα εκδήλωση</button>
    </div>

    <section id="pendingView">
      <div id="count" class="count"></div>
      <div id="candidates"></div>
    </section>

    <section id="publishedView" class="hidden">
      <div class="toolbar">
        <input id="publishedSearch" placeholder="Αναζήτηση τίτλου, πόλης ή χώρου">
        <button id="refreshPublished" class="ghost">Ανανέωση</button>
      </div>
      <div id="publishedCount" class="count"></div>
      <div id="publishedList"></div>
    </section>

    <section id="newView" class="hidden">
      <div class="card">
        <div class="form-title">Νέα εκδήλωση</div>
        <div class="sub">Χειροκίνητη καταχώρηση και άμεση δημοσίευση.</div>

        <label>Τίτλος *</label><input id="fTitle">
        <div class="grid2">
          <div><label>Ημερομηνία *</label><input id="fDate" type="date"></div>
          <div><label>Ώρα έναρξης *</label><input id="fTime" type="time"></div>
        </div>
        <label>Χώρος / μαγαζί *</label><input id="fVenue">
        <div class="grid2">
          <div><label>Πόλη *</label><input id="fCity"></div>
          <div>
            <label>Νομός / περιοχή *</label>
            <select id="fRegion">
              <option value="">Επιλογή</option>
              <option>Ηράκλειο</option><option>Χανιά</option><option>Ρέθυμνο</option><option>Λασίθι</option>
            </select>
          </div>
        </div>
        <label>Διεύθυνση</label><input id="fAddress">
        <label>Καλλιτέχνες</label><input id="fArtists">
        <label>Είδη μουσικής</label><input id="fGenres">
        <div class="grid2">
          <div><label>Τιμή / είσοδος</label><input id="fPrice"></div>
          <div><label>Τηλέφωνο</label><input id="fPhone"></div>
        </div>
        <label>Poster / εικόνα URL</label><input id="fPoster">
        <label>Περιγραφή</label><textarea id="fDescription"></textarea>
        <button id="publishManualBtn" class="approve full">Δημοσίευση εκδήλωσης</button>
        <div id="manualMsg"></div>
      </div>
    </section>
  </section>
</main>

<script>
const db = window.supabase.createClient("https://skstztwseipuqpqtlzfa.supabase.co", "sb_publishable_lnNg0aoYe4zsBKkV9XactA_IzcWBdiJ");
const $ = id => document.getElementById(id);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function slugify(text){
  const greek={'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o'};
  return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .split("").map(ch=>greek[ch]||ch).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,55)||"item";
}
function uniqueSlug(text){ return slugify(text)+"-"+Date.now().toString(36); }
function formatDate(v){ return v ? new Date(v+"T12:00:00").toLocaleDateString("el-GR",{day:"numeric",month:"long",year:"numeric"}) : "Χωρίς ημερομηνία"; }
function formatTime(v){ return v ? String(v).slice(0,5) : "Χωρίς ώρα"; }
function splitCSV(v){ return String(v||"").split(",").map(x=>x.trim()).filter(Boolean); }

async function showCorrectView(){
  const {data:{session}} = await db.auth.getSession();
  $("loginView").classList.toggle("hidden", !!session);
  $("adminView").classList.toggle("hidden", !session);
  if(session) await loadCandidates();
}
$("loginBtn").onclick = async()=>{
  $("loginMsg").textContent="Σύνδεση...";
  const {error} = await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){$("loginMsg").textContent="Αποτυχία σύνδεσης: "+error.message;$("loginMsg").className="error";return;}
  $("loginMsg").textContent=""; await showCorrectView();
};
$("logoutBtn").onclick = async()=>{await db.auth.signOut();await showCorrectView();};

function setTab(which){
  for(const name of ["pending","published","new"]){
    $(name+"View").classList.toggle("hidden",name!==which);
    $("tab"+name[0].toUpperCase()+name.slice(1)).classList.toggle("active",name===which);
  }
  if(which==="pending") loadCandidates();
  if(which==="published") loadPublished();
}
$("tabPending").onclick=()=>setTab("pending");
$("tabPublished").onclick=()=>setTab("published");
$("tabNew").onclick=()=>setTab("new");

async function getOrCreate(table,name){
  const clean=String(name||"").trim(); if(!clean)return null;
  const {data:existing,error:findError}=await db.from(table).select("id").ilike("name",clean).limit(1);
  if(findError)throw findError;
  if(existing?.length)return existing[0].id;
  const {data:created,error:createError}=await db.from(table).insert({name:clean,slug:uniqueSlug(clean)}).select("id").single();
  if(createError)throw createError; return created.id;
}
async function getOrCreateVenue(name,city,region,address,phone){
  const clean=String(name||"").trim(); if(!clean)return null;
  const {data:existing,error:findError}=await db.from("venues").select("id").ilike("name",clean).limit(1);
  if(findError)throw findError;
  if(existing?.length)return existing[0].id;
  const {data:created,error:createError}=await db.from("venues").insert({
    name:clean,slug:uniqueSlug(clean),city:city||null,region:region||null,address:address||null,phone:phone||null
  }).select("id").single();
  if(createError)throw createError; return created.id;
}

async function loadCandidates(){
  $("candidates").innerHTML='<div class="empty">Φόρτωση...</div>';
  const {data,error}=await db.from("ingestion_candidates").select("*").eq("review_status","pending").order("created_at",{ascending:false});
  if(error){$("candidates").innerHTML='<div class="card error">'+esc(error.message)+'</div>';return;}
  window.currentCandidates=data||[];
  $("count").textContent=`${data.length} εκδηλώσεις περιμένουν έλεγχο`;
  if(!data.length){$("candidates").innerHTML='<div class="card empty">Δεν υπάρχουν εκδηλώσεις προς έλεγχο.</div>';return;}
 $("candidates").innerHTML=data.map(c=>`
  <article class="card">
    ${c.image_url ? `
      <img
        src="${esc(c.image_url)}"
        alt="${esc(c.extracted_title || "Αφίσα εκδήλωσης")}"
        style="width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:14px"
        loading="lazy"
      >
    ` : ""}

    <span class="pill">${esc(c.detection_type||"candidate")}</span>

    <div class="title">${esc(c.extracted_title||"Χωρίς τίτλο")}</div>

    <div class="meta">
      <div>
        <strong>Ημερομηνία:</strong>
        ${esc(formatDate(c.extracted_date))} · ${esc(formatTime(c.extracted_time))}
      </div>

      <div>
        <strong>Χώρος:</strong>
        ${esc(c.extracted_venue||"—")}
      </div>

      <div>
        <strong>Περιοχή:</strong>
        ${esc(c.extracted_city||c.extracted_region||"—")}
      </div>

      ${c.extracted_artists?.length ? `
        <div>
          <strong>Καλλιτέχνες:</strong>
          ${esc(c.extracted_artists.join(", "))}
        </div>
      ` : ""}

      ${c.extracted_price ? `
        <div>
          <strong>Τιμή:</strong>
          ${esc(c.extracted_price)}
        </div>
      ` : ""}

      ${c.confidence_score != null ? `
        <div>
          <strong>Confidence:</strong>
          ${esc(c.confidence_score)}%
        </div>
      ` : ""}
    </div>

    ${c.original_text ? `
      <div class="original">
        <strong>Περιγραφή πηγής:</strong><br>
        ${esc(c.original_text)}
      </div>
    ` : ""}

    ${c.source_url ? `
      <div style="margin-top:12px">
        <a
          href="${esc(c.source_url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Άνοιγμα αρχικής πηγής ↗
        </a>
      </div>
    ` : ""}

    <div class="actions">
      <button class="approve" onclick="approveCandidate('${c.id}')">
        Έγκριση & Δημοσίευση
      </button>

      <button class="reject" onclick="rejectCandidate('${c.id}')">
        Απόρριψη
      </button>
    </div>
  </article>
`).join("");
}

async function approveCandidate(id){
  const c=(window.currentCandidates||[]).find(x=>x.id===id); if(!c)return;
  if(!confirm("Να εγκριθεί και να δημοσιευτεί;"))return;
  try{
    const venue_id = c.extracted_venue ? await getOrCreateVenue(c.extracted_venue,c.extracted_city,c.extracted_region,"",c.extracted_phone||"") : null;
    const {data:event,error}=await db.from("events").insert({
      title:c.extracted_title||"Live εκδήλωση",slug:uniqueSlug(c.extracted_title||"live"),description:c.original_text||null,
      event_date:c.extracted_date,start_time:c.extracted_time,venue_id,region:c.extracted_region||null,city:c.extracted_city||null,
      price_text:c.extracted_price||null,phone:c.extracted_phone||null,poster_url:c.image_url||null,status:"published",
      created_via:"manual",confidence_score:c.confidence_score??null,last_verified_at:new Date().toISOString()
    }).select("id").single();
    if(error)throw error;
    for(const name of (c.extracted_artists||[])){const artist_id=await getOrCreate("artists",name);const r=await db.from("event_artists").insert({event_id:event.id,artist_id});if(r.error)throw r.error;}
    for(const name of (c.extracted_genres||[])){const genre_id=await getOrCreate("genres",name);const r=await db.from("event_genres").insert({event_id:event.id,genre_id});if(r.error)throw r.error;}
    const r=await db.from("ingestion_candidates").update({review_status:"approved",possible_duplicate_event_id:event.id}).eq("id",id);
    if(r.error)throw r.error;
    alert("Η εκδήλωση εγκρίθηκε και δημοσιεύτηκε!"); await loadCandidates();
  }catch(err){alert("Σφάλμα: "+(err.message||err));}
}
async function rejectCandidate(id){
  if(!confirm("Να απορριφθεί αυτή η εκδήλωση;"))return;
  const {error}=await db.from("ingestion_candidates").update({review_status:"rejected"}).eq("id",id);
  if(error)return alert("Σφάλμα: "+error.message); await loadCandidates();
}

async function loadPublished(){
  $("publishedList").innerHTML='<div class="empty">Φόρτωση...</div>';
  const {data,error}=await db.from("events").select(`
    *,
    venue:venues(id,name,city,region,address,phone),
    event_artists(artist:artists(id,name)),
    event_genres(genre:genres(id,name))
  `).eq("status","published").order("event_date",{ascending:true}).order("start_time",{ascending:true});
  if(error){$("publishedList").innerHTML='<div class="card error">'+esc(error.message)+'</div>';return;}
  window.publishedEvents=data||[]; renderPublished();
}
function renderPublished(){
  const q=$("publishedSearch").value.trim().toLowerCase();
  const data=(window.publishedEvents||[]).filter(e=>[e.title,e.city,e.region,e.venue?.name].join(" ").toLowerCase().includes(q));
  $("publishedCount").textContent=`${data.length} δημοσιευμένες εκδηλώσεις`;
  if(!data.length){$("publishedList").innerHTML='<div class="card empty">Δεν βρέθηκαν εκδηλώσεις.</div>';return;}
  $("publishedList").innerHTML=data.map(e=>`
    <article class="card">
      <span class="pill published-pill">Δημοσιευμένη</span>
      <div class="title">${esc(e.title)}</div>
      <div class="meta">
        <div><strong>Ημερομηνία:</strong> ${esc(formatDate(e.event_date))} · ${esc(formatTime(e.start_time))}</div>
        <div><strong>Χώρος:</strong> ${esc(e.venue?.name||"—")}</div>
        <div><strong>Περιοχή:</strong> ${esc(e.city||e.region||"—")}</div>
      </div>
      <div class="actions">
        <a class="edit" href="admin-edit.html?id=${encodeURIComponent(e.id)}">Επεξεργασία</a>
        <button class="danger" onclick="deleteEvent('${e.id}')">Διαγραφή</button>
      </div>
    </article>`).join("");
}
$("publishedSearch").oninput=renderPublished;
$("refreshPublished").onclick=loadPublished;

async function deleteEvent(id){
  const e=(window.publishedEvents||[]).find(x=>x.id===id);
  if(!confirm(`Να διαγραφεί οριστικά η εκδήλωση "${e?.title||""}";`))return;
  try{
    let r=await db.from("event_artists").delete().eq("event_id",id); if(r.error)throw r.error;
    r=await db.from("event_genres").delete().eq("event_id",id); if(r.error)throw r.error;
    await db.from("ingestion_candidates").update({possible_duplicate_event_id:null}).eq("possible_duplicate_event_id",id);
    r=await db.from("events").delete().eq("id",id); if(r.error)throw r.error;
    alert("Η εκδήλωση διαγράφηκε."); await loadPublished();
  }catch(err){alert("Δεν διαγράφηκε: "+(err.message||err));}
}

$("publishManualBtn").onclick=async()=>{
  const msg=$("manualMsg");msg.textContent="";
  const title=$("fTitle").value.trim(),event_date=$("fDate").value,start_time=$("fTime").value,venueName=$("fVenue").value.trim(),
  city=$("fCity").value.trim(),region=$("fRegion").value,address=$("fAddress").value.trim(),
  artists=splitCSV($("fArtists").value),genres=splitCSV($("fGenres").value),price=$("fPrice").value.trim(),
  phone=$("fPhone").value.trim(),poster=$("fPoster").value.trim(),description=$("fDescription").value.trim();
  if(!title||!event_date||!start_time||!venueName||!city||!region){msg.textContent="Συμπλήρωσε τα υποχρεωτικά πεδία.";msg.className="error";return;}
  if(!confirm("Να δημοσιευτεί τώρα αυτή η εκδήλωση;"))return;
  try{
    const venue_id=await getOrCreateVenue(venueName,city,region,address,phone);
    const {data:event,error}=await db.from("events").insert({
      title,slug:uniqueSlug(title),description:description||null,event_date,start_time,venue_id,region,city,address:address||null,
      price_text:price||null,phone:phone||null,poster_url:poster||null,status:"published",created_via:"manual",confidence_score:100,last_verified_at:new Date().toISOString()
    }).select("id").single();
    if(error)throw error;
    for(const name of artists){const artist_id=await getOrCreate("artists",name);const r=await db.from("event_artists").insert({event_id:event.id,artist_id});if(r.error)throw r.error;}
    for(const name of genres){const genre_id=await getOrCreate("genres",name);const r=await db.from("event_genres").insert({event_id:event.id,genre_id});if(r.error)throw r.error;}
    msg.textContent="Η εκδήλωση δημοσιεύτηκε επιτυχώς!";msg.className="ok";
  }catch(err){msg.textContent="Σφάλμα: "+(err.message||err);msg.className="error";}
};

showCorrectView();
</script>
</body>
</html>
